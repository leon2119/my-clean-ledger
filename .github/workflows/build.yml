name: Build Mobile App
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js Environment
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Compatible Gradle version
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.7

    - name: Install Tools and Create App Container
      run: |
        npm install -g cordova
        cordova create app com.leon2119.cleanledger LedgerBook
        cd app
        cordova platform add android@12.0.0 --save
        rm -rf www/*
        cp ../index.html www/index.html

    - name: Compile Unsigned Release APK
      run: |
        cd app
        # Force cordova to use the pre-installed stable Gradle 8.7 build path
        export CORDOVA_ANDROID_GRADLE_DISTRIBUTION_URL="https://gradle.org"
        cordova build android --release --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release-apk
        path: app/platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk
