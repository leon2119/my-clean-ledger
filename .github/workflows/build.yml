name: Build Mobile App
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js Environment
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '21'

    - name: Scaffold App Asset Web Directory
      run: |
        mkdir www
        cp index.html www/index.html

    - name: Initialize Verified Capacitor App Container
      run: |
        npm install @capacitor/core @capacitor/cli
        npx cap init LedgerBook com.leon2119.cleanledger --web-dir=www

    - name: Install Android Platform Extensions
      run: |
        npm install @capacitor/android
        npx cap add android

    - name: Sync App Interface into Android Wrapper
      run: npx cap sync android

    - name: Patch Gradle Duplication Conflict Configurations
      run: |
        cd android
        
        # Enable AndroidX compatibility flags
        echo "android.useAndroidX=true" >> gradle.properties
        echo "android.enableJetifier=true" >> gradle.properties
        echo "org.gradle.dependency.verification=off" >> gradle.properties

        # Inject a strategy rule to force unique Kotlin version alignments and resolve duplicated packages
        cat << 'EOF' >> app/build.gradle
        configurations.all {
            resolutionStrategy {
                force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.22'
                force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.22'
                force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.22'
            }
        }
        EOF

    - name: Compile Automated Release APK Package
      run: |
        cd android
        ./gradlew assembleRelease --no-daemon -Dorg.gradle.dependency.verification=off

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release-apk
        path: android/app/build/outputs/apk/release/app-release-unsigned.apk
