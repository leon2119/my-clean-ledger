name: Build Mobile App
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js Environment
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '21'

    - name: Scaffold App Asset Web Directory
      run: |
        mkdir www
        cp index.html www/index.html

    - name: Initialize Verified Capacitor App Container
      run: |
        npm install @capacitor/core @capacitor/cli
        npx cap init LedgerBook com.leon2119.cleanledger --web-dir=www

    - name: Install Android Platform Extensions
      run: |
        npm install @capacitor/android
        npx cap add android

    - name: Sync App Interface into Android Wrapper
      run: npx cap sync android

    - name: Inject Native Android Print & PDF Saver into MainActivity
      run: |
        cat << 'EOF' > android/app/src/main/java/com/leon2119/cleanledger/MainActivity.java
        package com.leon2119.cleanledger;

        import android.content.Context;
        import android.os.Bundle;
        import android.print.PrintAttributes;
        import android.print.PrintDocumentAdapter;
        import android.print.PrintManager;
        import android.webkit.JavascriptInterface;
        import com.getcapacitor.BridgeActivity;

        public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                this.bridge.getWebView().addJavascriptInterface(new Object() {
                    @JavascriptInterface
                    public void printPage(final String jobName) {
                        runOnUiThread(new Runnable() {
                            @Override
                            public void run() {
                                PrintManager pm = (PrintManager) getSystemService(Context.PRINT_SERVICE);
                                PrintDocumentAdapter adapter = bridge.getWebView().createPrintDocumentAdapter(jobName);
                                pm.print(jobName, adapter, new PrintAttributes.Builder().build());
                            }
                        });
                    }
                }, "AndroidPrinter");
            }
        }
        EOF

    - name: Patch Gradle Duplication Conflict Configurations
      run: |
        cd android
        echo "android.useAndroidX=true" >> gradle.properties
        echo "android.enableJetifier=true" >> gradle.properties
        echo "org.gradle.dependency.verification=off" >> gradle.properties

        cat << 'EOF' >> app/build.gradle
        configurations.all {
            resolutionStrategy {
                force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.22'
                force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.22'
                force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.22'
            }
        }
        EOF

    - name: Compile Automated Signed Debug APK Package
      run: |
        cd android
        ./gradlew assembleDebug --no-daemon -Dorg.gradle.dependency.verification=off

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
