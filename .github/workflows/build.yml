name: Build Mobile App
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Scaffold Native Android App Project
      run: |
        mkdir -p app/src/main/java/com/leon2119/cleanledger
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/assets

        cp index.html app/src/main/assets/index.html

        echo "include ':app'" > settings.gradle
        echo "android.useAndroidX=true" > gradle.properties
        echo "android.enableJetifier=true" >> gradle.properties

        printf "buildscript {\n    repositories { google(); mavenCentral() }\n    dependencies { classpath 'com.android.tools.build:gradle:8.2.1' }\n}\nallprojects {\n    repositories { google(); mavenCentral() }\n}\n" > build.gradle
        
        printf "plugins {\n    id 'com.android.application'\n}\nandroid {\n    namespace 'com.leon2119.cleanledger'\n    compileSdk 34\n    defaultConfig {\n        applicationId \"com.leon2119.cleanledger\"\n        minSdk 24\n        targetSdk 34\n        versionCode 1\n        versionName \"1.0\"\n    }\n    buildTypes {\n        release {\n            minifyEnabled false\n        }\n    }\n}\ndependencies {\n    implementation 'androidx.appcompat:appcompat:1.6.1'\n}\n" > app/build.gradle

    - name: Build Android Manifest and Native Java Shell
      run: |
        # Using a raw string block to prevent variable stripping
        echo '<?xml version="1.0" encoding="utf-8"?>' > app/src/main/AndroidManifest.xml
        echo '<manifest xmlns:android="http://android.com">' >> app/src/main/AndroidManifest.xml
        echo '    <uses-permission android:name="android.permission.INTERNET" />' >> app/src/main/AndroidManifest.xml
        echo '    <application android:label="LedgerBook" android:theme="@style/Theme.AppCompat.Light.NoActionBar" android:hardwareAccelerated="true">' >> app/src/main/AndroidManifest.xml
        echo '        <activity android:name="com.leon2119.cleanledger.MainActivity" android:exported="true">' >> app/src/main/AndroidManifest.xml
        echo '            <intent-filter>' >> app/src/main/AndroidManifest.xml
        echo '                <action android:name="android.intent.action.MAIN" />' >> app/src/main/AndroidManifest.xml
        echo '                <category android:name="android.intent.category.LAUNCHER" />' >> app/src/main/AndroidManifest.xml
        echo '            </intent-filter>' >> app/src/main/AndroidManifest.xml
        echo '        </activity>' >> app/src/main/AndroidManifest.xml
        echo '    </application>' >> app/src/main/AndroidManifest.xml
        echo '</manifest>' >> app/src/main/AndroidManifest.xml

        printf "package com.leon2119.cleanledger;\nimport android.os.Bundle;\nimport android.webkit.WebSettings;\nimport android.webkit.WebView;\nimport androidx.appcompat.app.AppCompatActivity;\npublic class MainActivity extends AppCompatActivity {\n    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n        WebView webView = new WebView(this);\n        WebSettings settings = webView.getSettings();\n        settings.setJavaScriptEnabled(true);\n        settings.setDomStorageEnabled(true);\n        webView.loadUrl(\"file:///android_asset/index.html\");\n        setContentView(webView);\n    }\n}\n" > app/src/main/java/com/leon2119/cleanledger/MainActivity.java

    - name: DIAGNOSTIC - Print Generated Manifest
      run: |
        echo "=== START OF GENERATED MANIFEST ==="
        cat app/src/main/AndroidManifest.xml
        echo "=== END OF GENERATED MANIFEST ==="

    - name: Generate Gradle Wrapper
      run: gradle wrapper

    - name: Compile Native Unsigned Release APK
      run: ./gradlew :app:assembleRelease --no-daemon
