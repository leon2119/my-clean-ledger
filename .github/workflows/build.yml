name: Build Mobile App
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js Environment
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '21'

    - name: Scaffold App Asset Web Directory
      run: |
        mkdir www
        cp index.html www/index.html

    - name: Initialize Verified Capacitor App Container
      run: |
        npm install @capacitor/core @capacitor/cli
        npx cap init LedgerBook com.leon2119.cleanledger --web-dir=www

    - name: Install Android Platform Extensions
      run: |
        npm install @capacitor/android
        npx cap add android

    - name: Sync App Interface into Android Wrapper
      run: npx cap sync android

    - name: Inject Native Android Print & Cloud Bridge into MainActivity
      run: |
        cat << 'EOF' > android/app/src/main/java/com/leon2119/cleanledger/MainActivity.java
        package com.leon2119.cleanledger;

        import android.content.Context;
        import android.os.Bundle;
        import android.print.PrintAttributes;
        import android.print.PrintDocumentAdapter;
        import android.print.PrintManager;
        import android.webkit.JavascriptInterface;
        import com.getcapacitor.BridgeActivity;
        import java.io.BufferedReader;
        import java.io.InputStreamReader;
        import java.io.OutputStream;
        import java.net.HttpURLConnection;
        import java.net.URL;

        public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                this.bridge.getWebView().addJavascriptInterface(new Object() {
                    @JavascriptInterface
                    public void printPage(final String jobName) {
                        runOnUiThread(new Runnable() {
                            @Override
                            public void run() {
                                PrintManager pm = (PrintManager) getSystemService(Context.PRINT_SERVICE);
                                PrintDocumentAdapter adapter = bridge.getWebView().createPrintDocumentAdapter(jobName);
                                pm.print(jobName, adapter, new PrintAttributes.Builder().build());
                            }
                        });
                    }

                                                           @JavascriptInterface
                    public String postCloud(final String urlString, final String jsonBody) {
                        StringBuilder trace = new StringBuilder();
                        try {
                            String currentUrl = urlString;
                            HttpURLConnection conn = null;
                            int code = 0;

                            for (int step = 1; step <= 6; step++) {
                                URL url = new URL(currentUrl);
                                conn = (HttpURLConnection) url.openConnection();
                                conn.setInstanceFollowRedirects(false);
                                conn.setRequestProperty("User-Agent", "Mozilla/5.0");

                                if (step == 1) {
                                    conn.setRequestMethod("POST");
                                    conn.setRequestProperty("Content-Type", "application/json; charset=UTF-8");
                                    conn.setDoOutput(true);
                                    OutputStream os = conn.getOutputStream();
                                    os.write(jsonBody.getBytes("UTF-8"));
                                    os.close();
                                } else {
                                    conn.setRequestMethod("GET");
                                }

                                code = conn.getResponseCode();
                                String loc = conn.getHeaderField("Location");
                                trace.append("Step ").append(step).append(": HTTP ").append(code);
                                if (loc != null) {
                                    trace.append(" -> ").append(loc.length() > 60 ? loc.substring(0, 60) + "..." : loc);
                                }
                                trace.append(" | ");

                                if (code == 301 || code == 302 || code == 303 || code == 307 || code == 308) {
                                    if (loc == null) break;
                                    currentUrl = loc;
                                } else {
                                    break;
                                }
                            }

                            BufferedReader br = new BufferedReader(new InputStreamReader(
                                code >= 200 && code < 400 ? conn.getInputStream() : conn.getErrorStream(), "UTF-8"
                            ));
                            StringBuilder sb = new StringBuilder();
                            String line;
                            while ((line = br.readLine()) != null) sb.append(line);
                            br.close();

                            String res = sb.toString().trim();
                            if (res.startsWith("{")) {
                                return res;
                            }

                            String cleanSnippet = res.replaceAll("<[^>]*>", " ").replaceAll("\\s+", " ").trim();
                            if (cleanSnippet.length() > 250) cleanSnippet = cleanSnippet.substring(0, 250);
                            return "{\"status\":\"error\",\"message\":\"DIAGNOSTIC: " + trace.toString().replace("\"", "'") + " BODY: " + cleanSnippet.replace("\"", "'") + "\"}";
                        } catch (Exception e) {
                            return "{\"status\":\"error\",\"message\":\"CRASH (" + trace.toString().replace("\"", "'") + "): " + e.toString().replace("\"", "'") + "\"}";
                        }
                    }

                }, "AndroidPrinter");
            }
        }
        EOF


    - name: Patch Gradle Duplication Conflict Configurations
      run: |
        cd android
        echo "android.useAndroidX=true" >> gradle.properties
        echo "android.enableJetifier=true" >> gradle.properties
        echo "org.gradle.dependency.verification=off" >> gradle.properties

        cat << 'EOF' >> app/build.gradle
        configurations.all {
            resolutionStrategy {
                force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.22'
                force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.22'
                force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.22'
            }
        }
        EOF

    - name: Compile Automated Signed Debug APK Package
      run: |
        cd android
        ./gradlew assembleDebug --no-daemon -Dorg.gradle.dependency.verification=off

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
