name: Build Mobile App
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js Environment
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '21'

    - name: Scaffold App Asset Web Directory
      run: |
        mkdir www
        cp index.html www/index.html

    - name: Initialize Verified Capacitor App Container
      run: |
        npm install @capacitor/core @capacitor/cli
        npx cap init LedgerBook com.leon2119.cleanledger --web-dir=www

    - name: Install Android Platform Extensions
      run: |
        npm install @capacitor/android @capacitor/filesystem @capacitor/share
        npx cap add android

    - name: Sync App Interface into Android Wrapper
      run: npx cap sync android
      
    - name: Configure Android FileProvider for PDF Sharing
      run: |
        mkdir -p android/app/src/main/res/xml
        cat << 'EOF' > android/app/src/main/res/xml/file_paths.xml
        <?xml version="1.0" encoding="utf-8"?>
        <paths xmlns:android="http://android.com">
            <cache-path name="my_cache_images" path="." />
            <files-path name="my_files" path="." />
            <external-cache-path name="my_external_cache" path="." />
        </paths>
        EOF


    - name: Patch Gradle Duplication Conflict Configurations
      run: |
        cd android
        echo "android.useAndroidX=true" >> gradle.properties
        echo "android.enableJetifier=true" >> gradle.properties
        echo "org.gradle.dependency.verification=off" >> gradle.properties

        cat << 'EOF' >> app/build.gradle
        configurations.all {
            resolutionStrategy {
                force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.22'
                force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.22'
                force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.22'
            }
        }
        EOF

    - name: Compile Automated Signed Debug APK Package
      run: |
        cd android
        ./gradlew assembleDebug --no-daemon -Dorg.gradle.dependency.verification=off

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
